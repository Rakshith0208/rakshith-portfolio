<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate | Gujja Rakshith Reddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="certificate-viewer.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="index.html">GRR<span>.</span></a>
    <a class="back" href="index.html#certifications">← BACK TO CERTIFICATIONS</a>
  </header>

  <main class="viewer">
    <div class="viewer-head">
      <p class="eyebrow">CERTIFICATION / <span id="number">01</span></p>
      <h1 id="title">CERTIFICATE</h1>
      <p id="type"></p>
    </div>

    <div class="certificate-frame">
      <img id="certificateImage" src="" alt="Selected certificate">
    </div>

    <div class="viewer-bottom">
      <a id="openFull" href="" target="_blank" rel="noopener noreferrer">OPEN FULL IMAGE ↗</a>
      <a href="index.html#certifications">ALL CERTIFICATES</a>
    </div>
  </main>

<script>
const certificates = {
  "cognifyz-ml-internship": ["01","COGNIFYZ — MACHINE LEARNING","INTERNSHIP","certificates/cognifyz-ml-internship.png"],
  "deloitte-data-analytics": ["02","DELOITTE — DATA ANALYTICS","JOB SIMULATION","certificates/deloitte-data-analytics.png"],
  "ea-software-engineering": ["03","ELECTRONIC ARTS — SOFTWARE ENGINEERING","JOB SIMULATION","certificates/ea-software-engineering.png"],
  "aws-solutions-architecture": ["04","AWS — SOLUTIONS ARCHITECTURE","JOB SIMULATION","certificates/aws-solutions-architecture.png"],
  "hp-agile-project-management": ["05","HP LIFE — AGILE PROJECT MANAGEMENT","COURSE","certificates/hp-agile-project-management.png"],
  "python-programming": ["06","UDEMY — PYTHON PROGRAMMING","COURSE","certificates/python-programming.png"],
  "generative-ai-studio": ["07","GOOGLE CLOUD / SIMPLILEARN — GENERATIVE AI STUDIO","COURSE","certificates/generative-ai-studio.png"],
  "chatgpt-101": ["08","SIMPLILEARN — CHATGPT 101","COURSE","certificates/chatgpt-101.png"],
  "smmct-2026-presentation": ["09","SMMCT 2026 — GUARDIAN PROTOCOL","CONFERENCE PRESENTATION","certificates/smmct-2026-presentation.png"]
};

const key = new URLSearchParams(location.search).get("cert") || "cognifyz-ml-internship";
const data = certificates[key] || certificates["cognifyz-ml-internship"];
document.getElementById("number").textContent = data[0];
document.getElementById("title").textContent = data[1];
document.getElementById("type").textContent = data[2];
document.getElementById("certificateImage").src = data[3];
document.getElementById("openFull").href = data[3];
</script>
</body>
</html>
